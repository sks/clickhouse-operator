# Example CHI spec for chctl — the cloud-neutral cluster definition.
# Same schema the operator reconciles on Kubernetes, restricted to the
# cloud-free subset (topology, settings, users, profiles). Instance
# sizing, disks and networking come from your infra, not this file.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: ch-int-dev
spec:
  configuration:
    clusters:
      - name: logexplorer
        layout:
          shardsCount: 1
          replicasCount: 1
    profiles:
      default/async_insert: "1"
    settings:
      query_log/partition_by: "toYYYYMM(event_date)"
      query_log/ttl: "event_date + INTERVAL 14 DAY DELETE"
