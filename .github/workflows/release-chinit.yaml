name: Release chinit

# Cross-builds the chinit binary (cmd/chinit) and publishes it as a
# GitHub Release so node bootstrap (cloud-init user-data, packer
# images) and humans can fetch a pinned binary:
#   curl -fsSL https://github.com/<repo>/releases/download/chinit-v0.1.0/chinit-linux-arm64
#
# Trigger: pushing a tag `chinit-v*`. The prefix keeps chinit releases
# namespaced apart from chctl (chctl-v*) and operator (v0.27.x) tags.
#
# Artifacts per release:
#   chinit-<os>-<arch>  stripped static binaries (linux/arm64+amd64,
#                       darwin/arm64+amd64)
#   chinit-SHA256SUMS   checksums (curl | sha256sum -c supply-chain check)
#
# The golden-AMI packer build and the chinit bootstrap (user-data
# wrapper) pin both the version and the sha256 — the same gating the
# chctl runtime-upgrade path uses.

on:
  push:
    tags:
      - "chinit-v*"

permissions:
  contents: write # create the Release + upload artifacts

jobs:
  release:
    name: Build & publish chinit release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (tagged tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (release gate)
        run: |
          # A tag that fails its suites is worse than no release: these
          # binaries are what cloud-init pipes straight into
          # /usr/local/bin and runs as root on every node boot.
          go vet ./pkg/chinit/... ./cmd/chinit/...
          go test ./pkg/chinit/...

      - name: Cross-build
        run: |
          VERSION="${GITHUB_REF_NAME#chinit-v}"
          # Version injection: node bootstrap compares the installed
          # binary's version against the targeted release (chinit
          # version) instead of unconditionally overwriting.
          LDFLAGS="-s -w -X github.com/altinity/clickhouse-operator/pkg/chinit/app.Version=${VERSION}"
          mkdir -p dist
          for target in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "-> dist/chinit-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/chinit-${os}-${arch}" ./cmd/chinit
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum chinit-* > chinit-SHA256SUMS
          cat chinit-SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#chinit-v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "chinit ${VERSION}" \
            --notes "Cloud-adaptive ClickHouse node bootstrapper (the cloud-init.sh Go port).

          ## chinit ${VERSION}

          The \`chinit boot\` command replaces the 3,170-line cloud-init stage-2
          script (and bootstrap.sh stage-1): it fetches its own config bundle
          (SHA256-gated), detects the cloud (AWS/Azure) via the provider
          factory, converges the node with state-aware retries, and installs
          its recurring jobs as chinit subcommands driven by systemd units.

          ### SHA256 gate
          The SHA256SUMS file is the supply-chain check the packer build
          and the user-data wrapper pin against." \
            dist/chinit-linux-arm64 dist/chinit-linux-amd64 \
            dist/chinit-darwin-arm64 dist/chinit-darwin-amd64 \
            dist/chinit-SHA256SUMS
