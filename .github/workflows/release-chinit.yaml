name: Release chinit

# Cross-builds the chinit binary (cmd/chinit) and publishes it as a
# GitHub Release so node bootstrap (cloud-init user-data, packer
# images) and humans can fetch a pinned binary:
#   curl -fsSL https://github.com/<repo>/releases/download/chinit-v0.1.0/chinit-linux-arm64
#
# Trigger: pushing a tag `chinit-v*`. The prefix keeps chinit releases
# namespaced apart from operator (v0.27.x) tags.
#
# Artifacts per release (produced by GoReleaser, see .goreleaser.chinit.yaml):
#   chinit-<os>-<arch>  stripped static binaries (linux/arm64+amd64,
#                       darwin/arm64+amd64)
#   chinit-SHA256SUMS   checksums (curl | sha256sum -c supply-chain check)
#
# The golden-AMI packer build and the chinit bootstrap (user-data
# wrapper) pin both the version and the sha256 — the same gating the
# runtime-upgrade path uses.

on:
  push:
    tags:
      # Bare semver: GoReleaser OSS publishes the release under the
      # CURRENT_TAG ref, which must be valid semver — the chinit-v
      # prefix never satisfies both that and the git-state check (the
      # v0.2.0 release-gate findings). v0.* cannot collide with the
      # operator's release-* tags or any other workflow trigger.
      - "v0.*"

permissions:
  contents: write # create the Release + upload artifacts

jobs:
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (tagged tree)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet + test
        run: |
          # A tag that fails its suites is worse than no release: these
          # binaries are what cloud-init pipes straight into
          # /usr/local/bin and runs as root on every node boot.
          go vet ./pkg/chinit/... ./cmd/chinit/...
          go test ./pkg/chinit/...

  release:
    name: Build & publish chinit release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (tagged tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tag metadata/changelog from git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.chinit.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GORELEASER_CURRENT_TAG is the ref the release publishes
          # under — it must both EXIST against HEAD (the git-state
          # check; a stripped form that names no ref fails "was not
          # made against commit") and parse as semver (the chinit-v
          # prefix fails "invalid semantic version"). Bare v0.* tags
          # satisfy both; the release NAME still renders
          # "chinit <version>" from name_template.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
