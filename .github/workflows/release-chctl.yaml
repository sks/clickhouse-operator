name: Release chctl

# Cross-builds the chctl binary (cmd/chctl) and publishes it as a GitHub
# Release so node bootstrap (cloud-init, packer images) and humans can
# fetch a pinned binary:
#   curl -fsSL https://github.com/<repo>/releases/download/chctl-v0.1.0/chctl-linux-arm64
#
# Trigger: pushing a tag `chctl-v*`. The prefix keeps chctl releases
# namespaced apart from operator release tags (v0.27.x).
#
# Artifacts per release:
#   chctl-<os>-<arch>   stripped static binaries (linux/arm64+amd64,
#                       darwin/arm64+amd64)
#   chctl-SHA256SUMS    checksums (curl | sha256sum -c supply-chain check)
#
# After the release is published, the mirror-s3 job copies the assets
# into the stack's S3 bootstrap prefix (bootstrap/artifacts/chctl/)
# so the version-gated node bootstrap and the golden-AMI build pick a
# new release up with zero manual staging.

on:
  push:
    tags:
      - "chctl-v*"

permissions:
  contents: write # create the Release + upload artifacts

jobs:
  release:
    name: Build & publish chctl release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (tagged tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (release gate)
        run: |
          # A tag that fails its suites is worse than no release: these
          # binaries are what cloud-init pipes straight into /usr/local/bin.
          go vet ./pkg/chctl/... ./cmd/chctl/...
          go test ./pkg/chctl/...

      - name: Cross-build
        run: |
          VERSION="${GITHUB_REF_NAME#chctl-v}"
          # Version injection: node bootstrap compares the installed
          # binary's version against the targeted release (chctl version)
          # instead of unconditionally overwriting. -s -w keep the
          # stripped static binary behavior.
          LDFLAGS="-s -w -X github.com/altinity/clickhouse-operator/pkg/chctl/app.Version=${VERSION}"
          mkdir -p dist
          for target in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "-> dist/chctl-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/chctl-${os}-${arch}" ./cmd/chctl
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum chctl-* > chctl-SHA256SUMS
          cat chctl-SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#chctl-v}"
          # Idempotent publishing: a re-run or re-pushed tag must not
          # collide with assets of a previous attempt. Drop any existing
          # release object for this tag (the tag itself stays), then
          # create fresh with all artifacts. Binaries are listed
          # explicitly — `dist/chctl-*` would also match chctl-SHA256SUMS
          # and uploading it twice is the 422 "already exists" failure.
          gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "chctl ${VERSION}" \
            --notes "$(cat <<NOTES
          ## chctl ${VERSION}

          Off-cluster ClickHouse control CLI — renders node configs and runs
          schema/replica/keeper-safety operations from a CHI/CHK spec, using
          the operator's own normalizer, config generators and schemer.

          Docs and usage examples: [docs/chctl.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/chctl.md)

          ### Install
          \`\`\`bash
          curl -fsSL -o chctl https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/chctl-linux-arm64
          chmod +x chctl && ./chctl help
          \`\`\`

          ### Verify
          \`\`\`bash
          curl -fsSL -o SHA256SUMS https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/chctl-SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          Version check (bootstrap scripts compare before overwriting):
          \`\`\`bash
          ./chctl version   # chctl ${VERSION}
          \`\`\`

          Built from \`${GITHUB_SHA}\` at tag \`${GITHUB_REF_NAME}\`.
          NOTES
          )" \
            dist/chctl-linux-arm64 dist/chctl-linux-amd64 \
            dist/chctl-darwin-arm64 dist/chctl-darwin-amd64 \
            dist/chctl-SHA256SUMS

  # ---------------------------------------------------------------------------
  # S3 mirror (convenience, not the artifact of record)
  # ---------------------------------------------------------------------------
  # The GitHub Release above IS the artifact of record; this job copies
  # the same assets into the stack's S3 bootstrap prefix so the
  # version-gated node bootstrap (bootstrap.sh: it head-objects
  # artifacts/chctl/<version>/chctl and swaps the AMI-baked binary,
  # checksum-gated) and the golden-AMI build (build-golden-ami.yml
  # stages the same key) pick a new release up with ZERO manual
  # staging. It is a separate job with `needs: release` so a mirror
  # failure (missing IAM permission, bucket outage, typo'd variable)
  # shows as a visibly failed downstream job while the release itself
  # stays published and installable from GitHub. If that trade-off
  # ever needs to change, the release must stay the thing that can't
  # be blocked — flip to continue-on-error only for mirror-s3.
  mirror-s3:
    name: Mirror artifacts to stack S3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release
    # The release is complete and authoritative regardless of this
    # job's outcome; a failure is visible in the run list (the red X
    # is the alert) but cannot un-publish or block the release.
    permissions:
      contents: read
      id-token: write # OIDC → role with s3:PutObject on the mirror prefix

    env:
      # Stack bootstrap bucket. A variable, not a literal: pointing
      # prod at a different bucket must be a workflow edit here, never
      # a per-release decision.
      CHCTL_MIRROR_BUCKET: ch-int-dev-clickhouse-data
      # Bootstrap prefix the stack's bootstrap.sh and the golden-AMI
      # build already read from (bootstrap_prefix default: "bootstrap").
      CHCTL_MIRROR_PREFIX: bootstrap/artifacts/chctl

    steps:
      - name: Checkout (tagged tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PACKER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Copy release artifacts to the bootstrap mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#chctl-v}"
          DEST="s3://${CHCTL_MIRROR_BUCKET}/${CHCTL_MIRROR_PREFIX}/${VERSION}"
          echo "mirroring chctl ${VERSION} -> ${DEST}"

          # Re-download the published assets from the release we just
          # created (not dist/ leftovers): the mirror carries exactly
          # what users get from GitHub, byte-for-byte.
          mkdir -p mirror
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'chctl-*' --dir mirror
          ls -l mirror

          # Key names match what the stack downloads, EXACTLY:
          #   bootstrap.sh:      CHCTL_ARTIFACT="artifacts/chctl/<version>/chctl"
          #                      — the PLAIN `chctl` key, no os-arch suffix
          #   build-golden-ami.yml stages the same plain `chctl` key
          #   The 0.1.3-era S3 staging used chctl-linux-arm64; the
          #   current stack expects `chctl` — so the mirror publishes
          #   the plain key (what bootstrap downloads) AND keeps the
          #   release asset names (GitHub parity, other archs, SUMS
          #   cross-checks). Both point at the same arm64 bytes.
          cp mirror/chctl-linux-arm64 mirror/chctl
          for key in chctl chctl-linux-arm64 chctl-linux-amd64 \
                     chctl-darwin-arm64 chctl-darwin-amd64 chctl-SHA256SUMS; do
            aws s3 cp "mirror/${key}" "${DEST}/${key}"
          done

          # Verify before declaring done: the plain key bootstrap.sh
          # downloads must match its SHA256SUMS line, and the binary
          # must report the tagged version (the runner is amd64, so
          # the version check runs the amd64 build).
          expected=$(grep ' chctl-linux-arm64$' mirror/chctl-SHA256SUMS | awk '{print $1}')
          actual=$(sha256sum mirror/chctl | awk '{print $1}')
          [ "$expected" = "$actual" ] \
            || { echo "mirrored chctl digest ${actual} != SHA256SUMS ${expected}"; exit 1; }
          chmod +x mirror/chctl-linux-amd64
          ./mirror/chctl-linux-amd64 version | grep -q "chctl ${VERSION}" \
            || { echo "mirrored binary does not report version ${VERSION}"; exit 1; }
          echo "mirror complete: ${DEST}/{chctl,chctl-<os>-<arch> x4,chctl-SHA256SUMS}"